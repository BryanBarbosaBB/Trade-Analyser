# Varredura automática a cada 30 min, do domingo à noite até sexta (horários em UTC; Brasília = UTC−3):
#   - 11:00–20:30 UTC = 08:00–17:30 Brasília (Londres/NY);
#   - 21:00–06:00 UTC = 18:00–03:00 Brasília (Ásia: sinais marcados como "não validados").
#   Nada roda entre 03:00 e 08:00 de Brasília. ~650 consultas/dia (limite grátis da Twelve Data: 800).
# Resultado salvo no ramo `dados` (um único commit, substituído a cada rodada). O site lê de lá.
# Secrets (Settings → Secrets and variables → Actions): TD_KEY (obrigatório) e NTFY_TOPIC.
name: Varredura

on:
  schedule:
    - cron: '0,30 11-20 * * 1-5'
    - cron: '0,30 21-23 * * 0-4'
    - cron: '0,30 0-5 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baixa os dados da rodada anterior
        run: |
          git clone --depth 1 --branch dados "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados \
            || mkdir -p dados

      - name: Varre os ativos
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/scan.js dados

      - name: Salva no ramo dados
        working-directory: dados
        run: |
          rm -rf .git
          git init -q -b dados
          git config user.name "varredura"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Varredura $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados
