<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Analisador de Mercado</title>
  <meta name="theme-color" content="#0f1419">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Analisador de Mercado</div>
  </header>

  <main>
    <!-- PAINEL -->
    <section id="v-painel" class="view">
      <div class="toolbar">
        <button id="btn-reload" class="primary">Atualizar</button>
        <span id="scan-status" class="muted"></span>
      </div>
      <div id="setup-hint" class="hint hidden"></div>
      <div class="list-head">
        <span>Ativo</span><span>D1 H4 H1 M15</span><span>Setup</span><span>Score</span><span>Status</span><span>Atualizado</span>
      </div>
      <div id="list"></div>
      <div class="card" id="history"></div>
    </section>

    <!-- DETALHE -->
    <section id="v-detalhe" class="view hidden">
      <div class="detail-head">
        <button id="btn-back">← Painel</button>
        <h1 id="d-title"></h1>
        <span id="d-status"></span>
      </div>
      <div class="tf-tabs" id="tf-tabs">
        <button data-tf="D1">D1</button><button data-tf="H4">H4</button><button data-tf="H1">H1</button><button data-tf="M15" class="active">M15</button>
        <label class="chk"><input type="checkbox" id="opt-zones" checked> Zonas</label>
        <label class="chk"><input type="checkbox" id="opt-levels" checked> S/R</label>
        <label class="chk"><input type="checkbox" id="opt-ema" checked> EMAs</label>
      </div>
      <div class="chart-wrap">
        <div id="chart"></div>
        <canvas id="overlay"></canvas>
      </div>
      <div id="rsi-chart"></div>
      <div class="grid">
        <div class="card" id="c-setup"></div>
        <div class="card" id="c-trend"></div>
        <div class="card" id="c-calc"></div>
      </div>
    </section>

  </main>


  <footer>Ferramenta de estudo e apoio à decisão. <strong>Não é recomendação de investimento.</strong> Dados: Twelve Data, varredura automática a cada 30 min. Gráficos: TradingView Lightweight Charts.</footer>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/config.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/data.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/setups.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
